services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: textile-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: textile-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped